name: Build Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Tester le moteur (sur la JVM)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 tests/test_android_core.py

      - name: Clé de signature (facultative)
        env:
          KEYSTORE_B64: ${{ secrets.VARIKA_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/varika.jks"
            echo "VARIKA_KEYSTORE=$RUNNER_TEMP/varika.jks" >> "$GITHUB_ENV"
          fi

      - name: Compiler les APK
        env:
          VARIKA_KEYSTORE_PASSWORD: ${{ secrets.VARIKA_KEYSTORE_PASSWORD }}
          VARIKA_KEY_ALIAS: ${{ secrets.VARIKA_KEY_ALIAS }}
          VARIKA_KEY_PASSWORD: ${{ secrets.VARIKA_KEY_PASSWORD }}
        run: |
          gradle -p android assembleDebug
          if [ -n "$VARIKA_KEYSTORE" ]; then gradle -p android assembleRelease; fi
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/VarikaDownload-1.3.0-test.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk dist/VarikaDownload-1.3.0.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: VarikaDownload-android
          path: dist/*.apk
