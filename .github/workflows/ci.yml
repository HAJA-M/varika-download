# Intégration continue : à chaque push ou pull request, tous les tests tournent.
# Une croix rouge sur GitHub = un test a échoué : rien n'est publié tant que ce n'est pas corrigé.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  moteur:
    name: Moteur Windows/PC (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q cryptography
      - name: Versions identiques partout
        run: python scripts/set_version.py --check
      - name: Moteur (multi-connexions, pause/reprise)
        run: python tests/test_moteur.py
      - name: Non-régression des bugs
        run: python tests/test_bugs.py
      - name: Coupures d'Internet + gros fichier
        env:
          VARIKA_BIG_GB: "1"          # 1 Go en CI (5 Go en local par défaut)
        run: python tests/test_reseau.py
      - name: HLS
        run: python tests/test_hls.py
      - name: Mises à jour (vérification SHA-256)
        run: python tests/test_updater.py

  android-core:
    name: Moteur Android (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Tests du moteur Android sur la JVM
        run: python3 tests/test_android_core.py

  navigateur:
    name: Extension + détection vidéo (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q playwright cryptography
          python -m playwright install --with-deps chromium
      - run: python tests/test_extension.py
      - run: python tests/test_video.py
      - run: python tests/test_dash.py
