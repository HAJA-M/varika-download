plugins {
    id 'com.android.application'
}

android {
    namespace 'com.varikaagency.download'
    compileSdk 35

    defaultConfig {
        applicationId 'com.varikaagency.download'
        minSdk 29            // Android 10+ : enregistrement dans « Téléchargements » sans permission de stockage
        targetSdk 34
        versionCode 10400
        versionName '1.4.0'
    }

    // Signature de la version « release » : fournie par les secrets GitHub (voir README)
    signingConfigs {
        // Clé « test » commune à toutes les compilations : chaque nouvelle version s'installe
        // par-dessus la précédente (Android exige la même signature). Pour le Play Store, utilisez
        // votre propre clé « release » (secrets GitHub, voir README).
        test {
            storeFile file("$rootDir/keystore/varika-test.jks")
            storePassword 'varika-test'
            keyAlias 'varika-test'
            keyPassword 'varika-test'
        }
        release {
            def ks = System.getenv('VARIKA_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('VARIKA_KEYSTORE_PASSWORD')
                keyAlias System.getenv('VARIKA_KEY_ALIAS')
                keyPassword System.getenv('VARIKA_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.test
        }
        release {
            minifyEnabled false
            signingConfig System.getenv('VARIKA_KEYSTORE') ? signingConfigs.release : signingConfigs.test
        }
    }

    // Le « lint » n'empêche pas la compilation en CI (les avertissements restent dans le rapport)
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // L'interface est la même que sur Windows : on copie ../../ui/index.html dans les ressources de l'appli
    sourceSets {
        main.assets.srcDirs += "$buildDir/generated/varika-ui"
    }
}

tasks.register('copyUi', Copy) {
    from("$rootDir/../ui") { include 'index.html' }
    into "$buildDir/generated/varika-ui/ui"
}
preBuild.dependsOn copyUi
